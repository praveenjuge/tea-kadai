name: Build and release

# Every push to main builds macOS, Windows and Linux and publishes them as the
# next patch release (v0.1.0, v0.1.1, ...). If a newer push lands while an
# older one is still building, the older run is cancelled: the latest wins.
# Pull requests build and test, without releasing. Pushes that only change the
# website (deployed by Cloudflare) don't make a new release.
#
# Releases are signed once the signing secrets are set up (docs/SIGNING.md):
# the Mac app is signed and notarized with rcodesign, and the Windows exe is
# signed by SignPath after a manual approval there. Without the secrets, the
# builds ship unsigned.
#
# Releases also go to itch.io once BUTLER_API_KEY and the ITCH_GAME variable
# are set (docs/ITCH.md), and to the Mac App Store once its signing secrets
# are (docs/APP_STORE.md): a Mac builds the App Store package, uploads it, and
# puts it up for review in place of any older version still waiting.

on:
  push:
    branches: [main]
    paths-ignore: ["website/**"]
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # SignPath reads this run's details and downloads the unsigned exe.
  actions: read

env:
  GODOT_VERSION: "4.7.2"
  KEEP_RELEASES: 10

jobs:
  build:
    runs-on: ubuntu-latest
    # Long enough to wait for the SignPath approval.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.next }}
      previous: ${{ steps.version.outputs.previous }}
    env:
      RELEASING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIGN_MAC: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MACOS_CERTIFICATE_P12 != '' }}
      SIGN_WINDOWS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SIGNPATH_API_TOKEN != '' }}
      ITCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUTLER_API_KEY != '' && vars.ITCH_GAME != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${latest:-none}. Next: v$next"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-v1

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # Only the templates the three exports need.
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/macos.zip \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Put Godot on the path
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --version

      - name: Stamp the version into the game
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"$NEXT\"/" project.godot
          # The updater reads the version from here, since a downloaded pack
          # can replace files but not project settings.
          echo "$NEXT" > version.txt
          sed -i "s/^application\/short_version=.*/application\/short_version=\"$NEXT\"/" export_presets.cfg
          sed -i "s/^application\/version=.*/application\/version=\"$GITHUB_RUN_NUMBER\"/" export_presets.cfg
          sed -i "s/^application\/file_version=.*/application\/file_version=\"$NEXT.0\"/" export_presets.cfg
          sed -i "s/^application\/product_version=.*/application\/product_version=\"$NEXT.0\"/" export_presets.cfg
          grep -E '^config/version' project.godot

      - name: Import the project
        run: godot --headless --path . --import

      - name: Core tests
        run: godot --headless --path . -s tests/test_core.gd

      - name: Export macOS, Windows and Linux
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "macOS" build/TeaKadai-macOS.zip
          godot --headless --path . --export-release "Windows" build/TeaKadai-Windows.exe
          godot --headless --path . --export-release "Linux" build/TeaKadai-Linux.x86_64
          tar -czf build/TeaKadai-Linux.tar.gz -C build TeaKadai-Linux.x86_64
          # The game's content on its own, for the in-game updater, and a
          # small file describing it (scripts/boot/updater.gd reads both).
          godot --headless --path . --export-pack "Linux" build/TeaKadai.pck
          printf '{"version": "%s", "engine": "%s.stable", "pck": "TeaKadai.pck", "size": %s, "sha256": "%s"}\n' \
            "$NEXT" "$GODOT_VERSION" "$(stat -c %s build/TeaKadai.pck)" "$(sha256sum build/TeaKadai.pck | cut -d' ' -f1)" \
            > build/version.json
          cat build/version.json
          for file in TeaKadai-macOS.zip TeaKadai-Windows.exe TeaKadai-Linux.tar.gz TeaKadai.pck version.json; do
            test -s "build/$file" || { echo "Missing build/$file"; exit 1; }
          done
          ls -la build

      - name: Sign and notarize the Mac app
        if: env.SIGN_MAC == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          name="apple-codesign-0.29.0-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/$name.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          rcodesign="/tmp/$name/rcodesign"

          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          echo "$MACOS_CERTIFICATE_P12" | base64 -d > "$keys/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_PASSWORD" > "$keys/password"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$keys/api-key.p8"
          "$rcodesign" encode-app-store-connect-api-key -o "$keys/api-key.json" \
            "$APPLE_API_ISSUER_ID" "$APPLE_API_KEY_ID" "$keys/api-key.p8"

          # Sign the app with the hardened runtime, have Apple notarize it,
          # staple the ticket on, and zip it back up.
          rm -rf build/mac && mkdir build/mac
          unzip -q build/TeaKadai-macOS.zip -d build/mac
          "$rcodesign" sign --p12-file "$keys/developer-id.p12" --p12-password-file "$keys/password" \
            --code-signature-flags runtime "build/mac/Tea Kadai.app"
          "$rcodesign" notary-submit --api-key-file "$keys/api-key.json" --staple "build/mac/Tea Kadai.app"
          rm build/TeaKadai-macOS.zip
          (cd build/mac && zip -qry ../TeaKadai-macOS.zip "Tea Kadai.app")

      - name: Upload the Windows exe for signing
        id: unsigned-windows
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: build/TeaKadai-Windows.exe
          retention-days: 1

      - name: Sign the Windows exe with SignPath
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tea-kadai
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          # Each release waits here until it's approved in SignPath.
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed-windows

      - name: Use the signed Windows exe
        if: env.SIGN_WINDOWS == 'true'
        run: mv -f build/signed-windows/TeaKadai-Windows.exe build/TeaKadai-Windows.exe

      - name: Keep the builds with this run
        uses: actions/upload-artifact@v4
        with:
          name: tea-kadai-${{ steps.version.outputs.next }}
          path: |
            build/TeaKadai-macOS.zip
            build/TeaKadai-Windows.exe
            build/TeaKadai-Linux.tar.gz
            build/TeaKadai.pck
            build/version.json
          retention-days: 7

      - name: Publish the release
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          tag="v$NEXT"
          # A cancelled run can leave a draft behind; clear any before starting.
          gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r draft; do gh release delete "$draft" --yes; done
          {
            echo "## Download"
            echo
            echo "- **Mac** (Intel and Apple Silicon): \`TeaKadai-macOS.zip\`. Unzip and open Tea Kadai. The first time, macOS blocks it: open System Settings → Privacy & Security and click **Open Anyway**."
            echo "- **Windows**: \`TeaKadai-Windows.exe\`. If Windows SmartScreen appears, click **More info → Run anyway**."
            echo "- **Linux**: \`TeaKadai-Linux.tar.gz\`. Extract and run \`TeaKadai-Linux.x86_64\`."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --pretty='- %s' "$PREVIOUS..HEAD"
            else
              git log --pretty='- %s'
            fi
          } > notes.md
          # Publish as a draft first, then make it the latest once every file is up.
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Tea Kadai $tag" --notes-file notes.md \
            build/TeaKadai-macOS.zip build/TeaKadai-Windows.exe build/TeaKadai-Linux.tar.gz \
            build/TeaKadai.pck build/version.json
          gh release edit "$tag" --draft=false --latest

      - name: Keep only the newest releases
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt,isDraft \
            --jq "[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
            while read -r old; do
              echo "Removing $old"
              gh release delete "$old" --cleanup-tag --yes
            done

      - name: Upload to itch.io
        if: env.ITCH == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          curl -fsSL --retry 3 -o /tmp/butler.zip "https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default"
          echo "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  /tmp/butler.zip" | sha256sum -c -
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          # One folder per platform, so the itch app installs and updates each.
          mkdir -p build/itch/mac build/itch/windows build/itch/linux
          unzip -q build/TeaKadai-macOS.zip -d build/itch/mac
          cp build/TeaKadai-Windows.exe build/itch/windows/
          cp build/TeaKadai-Linux.x86_64 build/itch/linux/
          for channel in mac windows linux; do
            /tmp/butler/butler push "build/itch/$channel" "$ITCH_GAME:$channel" --userversion "$NEXT"
          done

  app-store:
    # Apple's packaging needs Xcode, so the App Store build runs on a Mac once
    # the release is out. The newest release always replaces whatever is
    # waiting for review (tools/app_store_submit.py).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      READY: ${{ secrets.APPSTORE_APP_CERTIFICATE_P12 != '' && secrets.APPSTORE_INSTALLER_CERTIFICATE_P12 != '' && secrets.APPSTORE_PROVISIONING_PROFILE != '' && secrets.APPSTORE_API_PRIVATE_KEY != '' }}
      APP_STORE_APP_ID: "6834836627"
      NEXT: ${{ needs.build.outputs.version }}
      PREVIOUS: ${{ needs.build.outputs.previous }}
    steps:
      - name: Skip without the App Store secrets
        if: env.READY != 'true'
        run: echo "The App Store signing secrets aren't set up yet (docs/APP_STORE.md), so this release skips the App Store."

      - uses: actions/checkout@v4
        if: env.READY == 'true'
        with:
          fetch-depth: 0

      - name: Cache Godot for Mac
        if: env.READY == 'true'
        id: godot-mac-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-mac
            ~/Library/Application Support/Godot/export_templates
          key: godot-mac-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot for Mac and the export template
        if: env.READY == 'true' && steps.godot-mac-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-mac
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot-mac
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/macos.zip -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Put Godot on the path
        if: env.READY == 'true'
        run: |
          mkdir -p ~/bin
          printf '#!/bin/sh\nexec "%s/godot-mac/Godot.app/Contents/MacOS/Godot" "$@"\n' "$HOME" > ~/bin/godot
          chmod +x ~/bin/godot
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/godot --version

      - name: Set up signing
        if: env.READY == 'true'
        env:
          APP_P12: ${{ secrets.APPSTORE_APP_CERTIFICATE_P12 }}
          INSTALLER_P12: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/app-store.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for name in APP_P12 INSTALLER_P12; do
            printf '%s' "${!name}" | base64 -D > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/TeaKadai_AppStore.provisionprofile"
          team=$(security find-identity -v -p codesigning "$keychain" | grep "Apple Distribution" | head -n 1 | sed -E 's/.*\(([A-Z0-9]{10})\).*/\1/')
          {
            echo "KEYCHAIN=$keychain"
            echo "APPLE_TEAM_ID=$team"
            echo "APPSTORE_PROFILE=$RUNNER_TEMP/TeaKadai_AppStore.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Build the App Store package
        if: env.READY == 'true'
        run: |
          tools/build_app_store.sh
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        if: env.READY == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/"AuthKey_$KEY_ID.p8"
          xcrun altool --upload-package build/TeaKadai-AppStore.pkg --type macos --apple-id "$APP_STORE_APP_ID" \
            --bundle-id teakadai.praveenjuge.game --bundle-version "$BUILD" --bundle-short-version-string "$NEXT" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Submit for review
        if: env.READY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          if [ -n "$PREVIOUS" ]; then
            git log --pretty='• %s' "$PREVIOUS..HEAD" > "$RUNNER_TEMP/notes.txt"
          else
            echo "• First release" > "$RUNNER_TEMP/notes.txt"
          fi
          "$RUNNER_TEMP/venv/bin/python" tools/app_store_submit.py --app "$APP_STORE_APP_ID" \
            --version "$NEXT" --build "$BUILD" --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Clean up signing
        if: always() && env.READY == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-store.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/TeaKadai_AppStore.provisionprofile"
